name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend_ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend_ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff + MyPy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy app

  test:
    name: Pytest (PostGIS + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    # The suite is deliberately an integration suite: field geometry is
    # PostGIS behaviour, so it is tested against PostGIS.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agri_guardian
          POSTGRES_PASSWORD: agri_guardian
          POSTGRES_DB: agri_guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agri_guardian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://agri_guardian:agri_guardian@localhost:5432/agri_guardian_test
      TEST_DATABASE_URL_SYNC: postgresql+psycopg://agri_guardian:agri_guardian@localhost:5432/agri_guardian_test
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        run: pytest -q

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
