[project]
name = "agri-guardian-api"
version = "0.1.0"
description = "AgriGuardian backend API - modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "geoalchemy2>=0.15,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "redis>=5.1,<6.0",
    "celery>=5.4,<6.0",
    "httpx>=0.27,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "firebase-admin>=6.6,<8.0",
    "email-validator>=2.2,<3.0",
    "structlog>=24.4,<25.0",
    # Mann-Whitney U test only (app/compute/agro.py) - a mature,
    # peer-reviewed implementation instead of a hand-written approximation.
    "scipy>=1.14,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# `alembic/` is a directory in this project, which otherwise makes Ruff
# classify the Alembic package itself as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# `Depends`/`Query`/`Header` in an argument default is how FastAPI declares
# dependencies; B008's "no function call in a default" rule does not apply.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["alembic/versions"]
