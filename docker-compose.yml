name: agri_guardian

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agri_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agri_guardian}
      POSTGRES_DB: ${POSTGRES_DB:-agri_guardian}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agri_guardian}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agri_guardian:agri_guardian@postgres:5432/agri_guardian}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg://agri_guardian:agri_guardian@postgres:5432/agri_guardian}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app:/backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/backend
      - ./backend/api/app:/app/app
      - ./infra/scripts:/infra/scripts
    command: ["/infra/scripts/entrypoint.sh"]

  worker:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agri_guardian:agri_guardian@postgres:5432/agri_guardian}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      PYTHONPATH: /app:/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/backend
    working_dir: /backend
    command: ["celery", "-A", "workers.celery_app:celery_app", "worker", "--loglevel=INFO"]

volumes:
  postgres_data:
