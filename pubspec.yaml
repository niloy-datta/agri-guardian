name: agri_guardian
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0

  camera: ^0.12.1
  geolocator: ^14.0.3
  permission_handler: ^13.0.2
  supabase_flutter: 2.17.2

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # FastAPI client: real HTTP calls, timeouts, and Idempotency-Key support.
  dio: ^5.11.1
  # Real connectivity signal for the "offline" banner, not a hardcoded true.
  connectivity_plus: ^7.3.1
  # OSM-based map for drawing a field's real boundary polygon; no API key
  # required, unlike the NASA/Copernicus satellite feature's own clients.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Drift/SQLite durable local store & sync queue
  drift: ^2.22.0
  drift_flutter: ^0.2.0
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  geocoding: ^5.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.14



flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Flutter does not recurse into subdirectories - each one is listed.
    - assets/images/runtime/
